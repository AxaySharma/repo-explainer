name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports — agent
        run: |
          python -c "import agent.tools; print('✅ agent.tools')"
          python -c "import agent.prompts; print('✅ agent.prompts')"
          python -c "import agent.repo_explainer; print('✅ agent.repo_explainer')"

      - name: Check imports — evals
        run: |
          python -c "from evals.test_cases import TEST_CASES; print(f'✅ {len(TEST_CASES)} test cases')"
          python -c "from evals.metrics import compute_overall_score; print('✅ evals.metrics')"
          python -c "from evals.harness import run_evals; print('✅ evals.harness')"

      - name: Check imports — optimizer
        run: |
          python -c "from optimizer.optimizer import PromptOptimizer; print('✅ optimizer')"

      - name: Check CLI scripts
        run: |
          python scripts/run_agent.py --help
          python scripts/run_evals.py --help
          python scripts/run_optimizer.py --help

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true